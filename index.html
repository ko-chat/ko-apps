<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KO Apps</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      text-align: center;
    }

    h1 {
      margin-top: 50px;
      font-size: 36px;
      color: #111111;
    }

    .menu {
      display: grid;
　　　　grid-template-columns: repeat(2, 1fr);
　　　　gap: 24px;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      margin-top: 50px;
    }

    .menu-button {
      width: 120px;
      height: 120px;
      border-radius: 30px;
      background: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 50px;
      text-decoration: none;

      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.10);

      transition: transform 0.15s;
    }

    /* 音楽 */
    .music {
      border: 3px solid #35bdf2;
      background: linear-gradient(
        145deg,
        #ffffff 55%,
        #eefaff 100%
      );
    }

    /* ちょっとGPT */
    .gpt {
      border: 3px solid #a875f5;
      background: linear-gradient(
        145deg,
        #ffffff 55%,
        #f8f1ff 100%
      );
    }

    /* 遊び */
    .asobi {
      border: 3px solid #f5a623;
      background: linear-gradient(
        145deg,
        #ffffff 55%,
        #f8f1ff 100%
      );
    }

    .menu-button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <h1>KO Apps</h1>

  <div class="menu">

    <a class="menu-button music" href="music.html">
      🎵
    </a>

    <a class="menu-button gpt" href="gpt.html">
      💬
    </a>

    <a class="menu-button asobi" href="asobi.html">
      🎮
    </a>
    
  </div>

</body>
</html>
