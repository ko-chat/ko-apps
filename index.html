<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KO Apps</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #ffffff;
      text-align: center;
    }

    h1 {
      margin-top: 50px;
      font-size: 36px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      margin-top: 50px;
    }

    .menu-button {
      width: 180px;
      height: 180px;
      border-radius: 30px;
      border: 2px solid #dddddd;
      background: white;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 80px;
      text-decoration: none;

      transition: transform 0.15s;
    }

    .menu-button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <h1>KO Apps</h1>

  <div class="menu">

    <a class="menu-button" href="music.html">
      🎵
    </a>

    <a class="menu-button" href="gpt.html">
      💬
    </a>

  </div>

</body>
</html>
