<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>コード構成音チェック - KO Apps</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      text-align: center;
      color: #111111;
    }

    h1 {
      margin-top: 40px;
      font-size: 30px;
    }

    .checker {
      width: 84%;
      max-width: 380px;
      margin: 40px auto 0;
      padding: 28px 20px;

      border: 3px solid #35bdf2;
      border-radius: 24px;

      background: linear-gradient(
        145deg,
        #ffffff 55%,
        #eefaff 100%
      );

      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
    }

    .select-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      margin-bottom: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    select {
      width: 180px;
      padding: 10px;

      border: 2px solid #35bdf2;
      border-radius: 12px;

      background: #ffffff;
      font-size: 17px;
    }

    .result {
      margin-top: 32px;
      padding-top: 26px;

      border-top: 1px solid #cccccc;

      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .play-button {
      margin-top: 28px;
      padding: 14px 24px;

      border: none;
      border-radius: 16px;

      background: #35bdf2;
      color: #ffffff;

      font-size: 18px;
      font-weight: bold;

      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.12);
    }

    .play-button:active {
      transform: scale(0.97);
    }

    .back {
      display: inline-block;
      margin-top: 40px;
      margin-bottom: 30px;

      color: #666666;
      font-size: 16px;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <h1>コード構成音チェック</h1>

  <div class="checker">

    <div class="select-row">
      <span>コード</span>

      <select id="root" onchange="showChord()">
        <option value="C">C</option>
        <option value="C#">C♯</option>
        <option value="Db">D♭</option>

        <option value="D">D</option>
        <option value="D#">D♯</option>
        <option value="Eb">E♭</option>

        <option value="E">E</option>

        <option value="F">F</option>
        <option value="F#">F♯</option>
        <option value="Gb">G♭</option>

        <option value="G">G</option>
        <option value="G#">G♯</option>
        <option value="Ab">A♭</option>

        <option value="A">A</option>
        <option value="A#">A♯</option>
        <option value="Bb">B♭</option>

        <option value="B">B</option>
      </select>
    </div>

    <div class="select-row">
      <span>種類</span>

      <select id="type" onchange="showChord()">

        <option value="major">Major</option>
        <option value="minor">Minor</option>
        <option value="dim">diminished</option>
        <option value="aug">augmented</option>

        <option value="7">7</option>
        <option value="maj7">maj7</option>
        <option value="m7">m7</option>
        <option value="m7b5">m7♭5</option>
        <option value="dim7">dim7</option>

      </select>
    </div>

    <div class="result" id="result">
      C ・ E ・ G
    </div>

    <button class="play-button" onclick="playChord()">
      ▶ コードを鳴らす
    </button>

  </div>

  <a class="back" href="music.html">
    ← 音楽へ戻る
  </a>


  <script>

    // 音名の並び
    const letters = [
      "C", "D", "E", "F", "G", "A", "B"
    ];

    // ナチュラル音の半音位置
    const naturalPitch = {
      C: 0,
      D: 2,
      E: 4,
      F: 5,
      G: 7,
      A: 9,
      B: 11
    };

    // コード種類ごとの半音構成
    const chordTypes = {

      // トライアド
      major: [0, 4, 7],
      minor: [0, 3, 7],
      dim:   [0, 3, 6],
      aug:   [0, 4, 8],

      // セブンス
      "7":   [0, 4, 7, 10],
      maj7:  [0, 4, 7, 11],
      m7:    [0, 3, 7, 10],
      m7b5:  [0, 3, 6, 10],
      dim7:  [0, 3, 6, 9]
    };


    // ルート音の臨時記号を半音数へ変換
    function accidentalValue(accidental) {

      if (accidental === "#") {
        return 1;
      }

      if (accidental === "b") {
        return -1;
      }

      return 0;
    }


    // 半音差を臨時記号へ変換
    function accidentalSymbol(value) {

      if (value === 0) {
        return "";
      }

      if (value === 1) {
        return "♯";
      }

      if (value === 2) {
        return "♯♯";
      }

      if (value === -1) {
        return "♭";
      }

      if (value === -2) {
        return "♭♭";
      }

      return "";
    }


    // 指定した度数の理論上の音名を作る
    function makeNote(root, letterStep, semitoneInterval) {

      const rootLetter =
        root.charAt(0);

      const rootAccidental =
        root.slice(1);

      const rootLetterIndex =
        letters.indexOf(rootLetter);

      const targetLetter =
        letters[
          (rootLetterIndex + letterStep) % 7
        ];

      let rootPitch =
        naturalPitch[rootLetter]
        + accidentalValue(rootAccidental);

      rootPitch =
        (rootPitch + 12) % 12;

      const targetPitch =
        (rootPitch + semitoneInterval) % 12;

      let difference =
        targetPitch
        - naturalPitch[targetLetter];

      while (difference > 6) {
        difference -= 12;
      }

      while (difference < -6) {
        difference += 12;
      }

      return targetLetter
        + accidentalSymbol(difference);
    }


    // 選択中のコード情報を取得
    function getChordData() {

      const root =
        document.getElementById("root").value;

      const type =
        document.getElementById("type").value;

      const intervals =
        chordTypes[type];

      /*
        1度 → 0
        3度 → 2
        5度 → 4
        7度 → 6
      */
      const letterSteps =
        [0, 2, 4, 6];

      const notes =
        intervals.map((interval, index) => {

          return makeNote(
            root,
            letterSteps[index],
            interval
          );

        });

      return {
        root: root,
        intervals: intervals,
        notes: notes
      };
    }


    // 構成音を表示
    function showChord() {

      const chord =
        getChordData();

      document.getElementById("result").textContent =
        chord.notes.join(" ・ ");
    }


    // ルート音を半音位置へ変換
    function getRootPitch(root) {

      const rootLetter =
        root.charAt(0);

      const rootAccidental =
        root.slice(1);

      let pitch =
        naturalPitch[rootLetter]
        + accidentalValue(rootAccidental);

      return (pitch + 12) % 12;
    }


    // MIDI番号を周波数へ変換
    function midiToFrequency(midiNumber) {

      return 440 *
        Math.pow(
          2,
          (midiNumber - 69) / 12
        );
    }

// ピアノ風の1音を作る
function playPianoTone(audioContext, frequency, startTime) {

  /*
    ピアノらしい響きを作るため、
    基本音＋複数の倍音を重ねる
  */
  const harmonics = [
    { ratio: 1, gain: 0.55 },
    { ratio: 2, gain: 0.20 },
    { ratio: 3, gain: 0.10 },
    { ratio: 4, gain: 0.05 }
  ];

  harmonics.forEach(harmonic => {

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.value =
      frequency * harmonic.ratio;

    /*
      ピアノのように

      ポン！
        ↓
      すぐ少し小さくなる
        ↓
      ゆっくり余韻が消える

      という音量変化を作る
    */

    gain.gain.setValueAtTime(
      0.0001,
      startTime
    );

    // 鍵盤を叩いた瞬間
    gain.gain.exponentialRampToValueAtTime(
      harmonic.gain,
      startTime + 0.015
    );

    // すぐ少し減衰
    gain.gain.exponentialRampToValueAtTime(
      harmonic.gain * 0.35,
      startTime + 0.35
    );

    // 約2.2秒で余韻を消す
    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      startTime + 2.2
    );

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start(startTime);

    oscillator.stop(
      startTime + 2.25
    );

  });
}


// コードを鳴らす
function playChord() {

  const chord =
    getChordData();

  const rootPitch =
    getRootPitch(chord.root);

  const rootMidi =
    60 + rootPitch;

  const midiNotes =
    chord.intervals.map(interval => {
      return rootMidi + interval;
    });

  const AudioContextClass =
    window.AudioContext
    || window.webkitAudioContext;

  const audioContext =
    new AudioContextClass();

  const now =
    audioContext.currentTime;

  midiNotes.forEach(midiNote => {

    const frequency =
      midiToFrequency(midiNote);

    playPianoTone(
      audioContext,
      frequency,
      now
    );

  });
}


    // 初期表示
    showChord();

  </script>

</body>
</html>
