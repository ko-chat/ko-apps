<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>コード構成音チェック - KO Apps</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      text-align: center;
      color: #111111;
    }

    h1 {
      margin-top: 40px;
      font-size: 30px;
    }

    .checker {
      width: 84%;
      max-width: 380px;
      margin: 40px auto 0;
      padding: 28px 20px;

      border: 3px solid #35bdf2;
      border-radius: 24px;

      background: linear-gradient(
        145deg,
        #ffffff 55%,
        #eefaff 100%
      );

      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
    }

    .select-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      margin-bottom: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    select {
      width: 180px;
      padding: 10px;

      border: 2px solid #35bdf2;
      border-radius: 12px;

      background: #ffffff;
      font-size: 17px;
    }

    .result {
      margin-top: 32px;
      padding-top: 26px;

      border-top: 1px solid #cccccc;

      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .back {
      display: inline-block;
      margin-top: 40px;
      margin-bottom: 30px;

      color: #666666;
      font-size: 16px;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <h1>コード構成音チェック</h1>

  <div class="checker">

    <div class="select-row">
      <span>コード</span>

      <select id="root" onchange="showChord()">
        <option value="C">C</option>
        <option value="C#">C♯</option>
        <option value="Db">D♭</option>

        <option value="D">D</option>
        <option value="D#">D♯</option>
        <option value="Eb">E♭</option>

        <option value="E">E</option>

        <option value="F">F</option>
        <option value="F#">F♯</option>
        <option value="Gb">G♭</option>

        <option value="G">G</option>
        <option value="G#">G♯</option>
        <option value="Ab">A♭</option>

        <option value="A">A</option>
        <option value="A#">A♯</option>
        <option value="Bb">B♭</option>

        <option value="B">B</option>
      </select>
    </div>

    <div class="select-row">
      <span>種類</span>

      <select id="type" onchange="showChord()">
        <option value="major">Major</option>
        <option value="minor">Minor</option>
        <option value="dim">diminished</option>
        <option value="aug">augmented</option>
      </select>
    </div>

    <div class="result" id="result">
      C ・ E ・ G
    </div>

  </div>

  <a class="back" href="music.html">
    ← 音楽へ戻る
  </a>

  <script>

    // 音名の並び
    const letters = [
      "C", "D", "E", "F", "G", "A", "B"
    ];

    // ナチュラル音の半音位置
    const naturalPitch = {
      C: 0,
      D: 2,
      E: 4,
      F: 5,
      G: 7,
      A: 9,
      B: 11
    };

    // トライアドの構成
    const chordTypes = {
      major: [0, 4, 7],
      minor: [0, 3, 7],
      dim:   [0, 3, 6],
      aug:   [0, 4, 8]
    };

    // ルート音の記号を半音数へ変換
    function accidentalValue(accidental) {

      if (accidental === "#") {
        return 1;
      }

      if (accidental === "b") {
        return -1;
      }

      return 0;
    }

    // 半音差を記号へ変換
    function accidentalSymbol(value) {

      if (value === 0) {
        return "";
      }

      if (value === 1) {
        return "♯";
      }

      if (value === 2) {
        return "♯♯";
      }

      if (value === -1) {
        return "♭";
      }

      if (value === -2) {
        return "♭♭";
      }

      return "";
    }

    // 指定された度数の音名を作る
    function makeNote(root, letterStep, semitoneInterval) {

      const rootLetter = root.charAt(0);
      const rootAccidental = root.slice(1);

      const rootLetterIndex =
        letters.indexOf(rootLetter);

      // 3度なら2文字先、5度なら4文字先
      const targetLetter =
        letters[
          (rootLetterIndex + letterStep) % 7
        ];

      // ルート音の実際の半音位置
      let rootPitch =
        naturalPitch[rootLetter]
        + accidentalValue(rootAccidental);

      rootPitch =
        (rootPitch + 12) % 12;

      // 求めたい音の半音位置
      const targetPitch =
        (rootPitch + semitoneInterval) % 12;

      // 対象となるアルファベットの
      // ナチュラル音との差を調べる
      let difference =
        targetPitch - naturalPitch[targetLetter];

      // 最も近い臨時記号へ調整
      while (difference > 6) {
        difference -= 12;
      }

      while (difference < -6) {
        difference += 12;
      }

      return targetLetter
        + accidentalSymbol(difference);
    }

    function showChord() {

      const root =
        document.getElementById("root").value;

      const type =
        document.getElementById("type").value;

      const intervals =
        chordTypes[type];

      // 1度
      const rootNote =
        makeNote(root, 0, intervals[0]);

      // 3度
      const thirdNote =
        makeNote(root, 2, intervals[1]);

      // 5度
      const fifthNote =
        makeNote(root, 4, intervals[2]);

      document.getElementById("result").textContent =
        rootNote
        + " ・ "
        + thirdNote
        + " ・ "
        + fifthNote;
    }

    // 初期表示
    showChord();

  </script>

</body>
</html>
