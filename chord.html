<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>コード構成音チェック - KO Apps</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      text-align: center;
      color: #111111;
    }

    h1 {
      margin-top: 40px;
      font-size: 30px;
    }

    .checker {
      width: 84%;
      max-width: 380px;
      margin: 40px auto 0;
      padding: 28px 20px;

      border: 3px solid #35bdf2;
      border-radius: 24px;

      background: linear-gradient(
        145deg,
        #ffffff 55%,
        #eefaff 100%
      );

      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
    }

    .select-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      margin-bottom: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    select {
      width: 180px;
      padding: 10px;

      border: 2px solid #35bdf2;
      border-radius: 12px;

      background: #ffffff;
      font-size: 17px;
    }

    .result {
      margin-top: 32px;
      padding-top: 26px;

      border-top: 1px solid #cccccc;

      font-size: 30px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .back {
      display: inline-block;
      margin-top: 40px;
      margin-bottom: 30px;

      color: #666666;
      font-size: 16px;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <h1>コード構成音チェック</h1>

  <div class="checker">

    <div class="select-row">
      <span>コード</span>

      <select id="root" onchange="showChord()">
        <option value="0">C</option>
        <option value="1">C#</option>
        <option value="2">D</option>
        <option value="3">D#</option>
        <option value="4">E</option>
        <option value="5">F</option>
        <option value="6">F#</option>
        <option value="7">G</option>
        <option value="8">G#</option>
        <option value="9">A</option>
        <option value="10">A#</option>
        <option value="11">B</option>
      </select>
    </div>

    <div class="select-row">
      <span>種類</span>

      <select id="type" onchange="showChord()">
        <option value="major">Major</option>
        <option value="minor">Minor</option>
        <option value="dim">diminished</option>
        <option value="aug">augmented</option>
      </select>
    </div>

    <div class="result" id="result">
      C ・ E ・ G
    </div>

  </div>

  <a class="back" href="music.html">
    ← 音楽へ戻る
  </a>

  <script>
    const notes = [
      "C", "C#", "D", "D#", "E", "F",
      "F#", "G", "G#", "A", "A#", "B"
    ];

    const chordTypes = {
      major: [0, 4, 7],
      minor: [0, 3, 7],
      dim: [0, 3, 6],
      aug: [0, 4, 8]
    };

    function showChord() {
      const root = Number(document.getElementById("root").value);
      const type = document.getElementById("type").value;

      const intervals = chordTypes[type];

      const chordNotes = intervals.map(interval => {
        return notes[(root + interval) % 12];
      });

      document.getElementById("result").textContent =
        chordNotes.join(" ・ ");
    }
  </script>

</body>
</html>
